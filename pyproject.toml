[build-system]
requires = ["setuptools>=64,<70"]
build-backend = "setuptools.build_meta"

[project]
name = "deepfakebench"
version = "1.0.0"
description = "A comprehensive benchmark for deepfake detection"
readme = "README.md"
requires-python = ">=3.7,<3.11"
license = { file = "LICENSE" }
dependencies = [
    "numpy==1.21.5",
    "pandas",
    "Pillow==9.0.1",
    "imageio==2.9.0",
    "imgaug==0.4.0",
    "tqdm==4.61.0",
    "scipy==1.7.3",
    "seaborn==0.11.2",
    "PyYAML==6.0",
    "imutils==0.5.4",
    "opencv-python==4.6.0.66",
    "scikit-image==0.19.2",
    "scikit-learn==1.0.2",
    "albumentations==1.1.0",
    "torch==1.12.0+cu113",
    "torchvision==0.13.0+cu113",
    "torchaudio==0.12.0",
    "efficientnet-pytorch==0.7.1",
    "timm==0.6.12",
    "segmentation-models-pytorch==0.3.2",
    "torchtoolbox==0.1.8.2",
    "tensorboard==2.10.1",
    "setuptools==59.5.0",
    "loralib",
    "einops",
    "transformers",
    "filterpy",
    "simplejson",
    "kornia",
    "fvcore",
    "clip @ git+https://github.com/openai/CLIP.git",
    "dlib==19.24.6",
]

[tool.uv.sources]
torch = { index = "pytorch-cu113" }
torchvision = { index = "pytorch-cu113" }
torchaudio = { index = "pytorch-cu113" }

[[tool.uv.index]]
name = "pytorch-cu113"
url = "https://download.pytorch.org/whl/cu113"
explicit = true

[tool.uv]
package = false
